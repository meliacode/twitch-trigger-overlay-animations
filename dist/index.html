<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitch Trigger Overlay Animations — Demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main class="shell">
      <h1>Twitch Trigger Overlay Animations</h1>
      <p>Choose a source, then play it to see the animation locally.</p>

      <div class="controls">
        <select id="animation" aria-label="Animation">
          <option value="../src/autumn-leaves/autumn-leaves.html">
            Autumn Leaves
          </option>
          <option value="../src/confetti-explosion/confetti-explosion.html">
            Confetti Explosion
          </option>
          <option value="../src/confetti-rain/confetti-rain.html">
            Confetti Rain
          </option>
          <option value="../src/cyber-glitch-screen/cyber-glitch-screen.html">
            Cyber Glitch Screen
          </option>
          <option value="../src/cyberpunk-pew-pew/cyberpunk-pew-pew.html">
            Cyberpunk Pew Pew
          </option>
          <option value="../src/dimensional-portal/dimensional-portal.html">
            Dimensional Portal
          </option>
          <option value="../src/evil-pumpkin/evil-pumpkin.html">
            Evil Pumpkin
          </option>
          <option value="../src/fireworks/fireworks.html">Fireworks</option>
          <option value="../src/game-crash-screen/game-crash-screen.html">
            Game Crash Screen
          </option>
          <option value="../src/gifts-rain/gifts-rain.html">Gifts Rain</option>
          <option value="../src/hellfire-candles/hellfire-candles.html">
            Hellfire Candles
          </option>
          <option value="../src/horror-screen-tear/horror-screen-tear.html">
            Horror Screen Tear
          </option>
          <option value="../src/meteor-shower/meteor-shower.html">
            Meteor Shower
          </option>
          <option value="../src/mystic-smoke/mystic-smoke.html">
            Mystic Smoke
          </option>
          <option value="../src/party-lights-laser/party-lights-laser.html">
            Party Lights Laser
          </option>
          <option
            value="../src/party-lights-spotlights/party-lights-spotlights.html"
          >
            Party Lights Spotlights
          </option>
          <option value="../src/retro-coin-rain/retro-coin-rain.html">
            Retro Coin Rain
          </option>
          <option value="../src/rpg-level-up/rpg-level-up.html">
            RPG Level Up
          </option>
          <option value="../src/sakura-petal-storm/sakura-petal-storm.html">
            Sakura Petal Storm
          </option>
          <option value="../src/sniper-focus/sniper-focus.html">
            Sniper Focus
          </option>
          <option value="../src/spread-love-rainbow/spread-love-rainbow.html">
            Spread Love Rainbow
          </option>
          <option value="../src/starry-sky/starry-sky.html">Starry Sky</option>
          <option value="../src/swarm-of-butterflies/swarm-of-butterflies.html">
            Swarm of Butterflies
          </option>
          <option value="../src/torrential-rain/torrential-rain.html">
            Torrential Rain
          </option>
          <option value="../src/underwater/underwater.html">Underwater</option>
        </select>
        <button id="play" type="button">Play animation</button>
      </div>

      <iframe
        id="iframe-container"
        title="Animation preview"
        src="../src/confetti-explosion/confetti-explosion.html"
      ></iframe>
    </main>

    <script>
      const select = document.querySelector("#animation");
      const container = document.querySelector("#iframe-container");

      document.querySelector("#play").addEventListener("click", () => {
        container.src = `${select.value}?preview=${Date.now()}`;
      });
      select.addEventListener("change", () => {
        container.src = select.value;
      });
    </script>
  </body>
</html>
