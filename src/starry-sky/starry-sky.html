<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starry Sky</title>

    <style>
      /* Transparent background is required for OBS overlays */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: sans-serif;
      }

      /* Canvas styling for OBS overlays */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
  </head>
  <body>
    <canvas id="starry-sky-canvas"></canvas>

    <script>
      // ==========================================
      // 1. CONFIGURATION
      // ==========================================

      const CONFIG = {
        starCount: 180,
        shineStrength: 1,
        duration: 9000,
      };

      const LOCAL_CONFIG = {};

      const TWITCH = {
        enabled: false,
        channel: "your_twitch_channel",
        command: "!starry-sky",
        globalCooldown: 500,
        userCooldown: 5000,
      };

      // ==========================================
      // 2. CONSTANTS
      // ==========================================

      const canvas = document.querySelector("#starry-sky-canvas");
      const context = canvas.getContext("2d");

      const stars = [];

      let width = 0;
      let height = 0;
      let startedAt = null;
      let frameId = null;

      // ==========================================
      // 3. ANIMATION
      // ==========================================

      function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      // Creates animation data for the effect.
      function createStars() {
        stars.length = 0;
        for (let index = 0; index < CONFIG.starCount; index++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: 0.55 + Math.random() * 1.75,
            phase: Math.random() * Math.PI * 2,
            speed: 1.3 + Math.random() * 3.2,
          });
        }
      }

      // Draws the current animation state.
      function drawStar(star, elapsed, opacity) {
        const pulse = (Math.sin(elapsed * star.speed + star.phase) + 1) / 2;
        const brightness = 0.25 + pulse * 0.75;
        const glowRadius = star.radius * (4 + pulse * 7) * CONFIG.shineStrength;
        const gradient = context.createRadialGradient(
          star.x,
          star.y,
          0,
          star.x,
          star.y,
          glowRadius,
        );
        gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
        gradient.addColorStop(0.12, "rgba(221, 238, 255, 0.9)");
        gradient.addColorStop(0.42, "rgba(161, 205, 255, 0.2)");
        gradient.addColorStop(1, "rgba(161, 205, 255, 0)");

        context.save();
        context.globalAlpha = opacity * brightness;
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(star.x, star.y, glowRadius, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = "#ffffff";
        context.beginPath();
        context.arc(
          star.x,
          star.y,
          star.radius * (0.7 + pulse * 0.3),
          0,
          Math.PI * 2,
        );
        context.fill();

        if (pulse > 0.82) {
          const rayLength =
            star.radius * (3 + pulse * 7) * CONFIG.shineStrength;
          context.strokeStyle = "rgba(235, 246, 255, 0.85)";
          context.lineWidth = Math.max(0.5, star.radius * 0.45);
          context.beginPath();
          context.moveTo(star.x - rayLength, star.y);
          context.lineTo(star.x + rayLength, star.y);
          context.moveTo(star.x, star.y - rayLength);
          context.lineTo(star.x, star.y + rayLength);
          context.stroke();
        }
        context.restore();
      }

      // Runs this animation step.
      function animate(now) {
        if (startedAt === null) return;

        const elapsed = now - startedAt;
        const fadeLength = Math.min(900, CONFIG.duration / 3);
        const opacity = Math.min(
          1,
          elapsed / fadeLength,
          (CONFIG.duration - elapsed) / fadeLength,
        );
        context.clearRect(0, 0, width, height);

        if (elapsed >= CONFIG.duration) {
          startedAt = null;
          stars.length = 0;
          frameId = null;
          return;
        }

        for (const star of stars) drawStar(star, elapsed / 1000, opacity);
        frameId = requestAnimationFrame(animate);
      }

      // Starts a new effect instance.
      function triggerStarrySky() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        createStars();
        startedAt = performance.now();
        frameId = requestAnimationFrame(animate);
      }

      window.addEventListener("resize", () => {
        resizeCanvas();
        if (startedAt !== null) createStars();
      });
      resizeCanvas();

      // ==========================================
      // 3. CALLBACK (COMFYJS)
      // ==========================================

      if (location.search.includes("preview")) triggerStarrySky();

      if (TWITCH.enabled) {
        ComfyJS.onCommand = (_user, command, _message, _flags, extra) => {
          if (`!${command}`.toLowerCase() !== TWITCH.command.toLowerCase())
            return;
          if (
            (extra.sinceLastCommand.any > 0 &&
              extra.sinceLastCommand.any < TWITCH.globalCooldown) ||
            (extra.sinceLastCommand.user > 0 &&
              extra.sinceLastCommand.user < TWITCH.userCooldown)
          )
            return;
          triggerStarrySky();
        };
        ComfyJS.Init(TWITCH.channel);
      }
    </script>
  </body>
</html>
