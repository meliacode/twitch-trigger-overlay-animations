<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti Rain</title>

    <style>
      /* Transparent background is required for OBS overlays */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: sans-serif;
      }

      /* Stage styling for OBS overlays */
      #confetti-container {
        position: fixed;
        overflow: hidden;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* Individual confetti styling */
      .piece {
        position: absolute;
        top: -4vh;
        width: var(--width);
        height: var(--height);
        background: var(--color);
        border-radius: 2px;
        animation: fall var(--duration) cubic-bezier(0.2, 0.65, 0.45, 1)
          forwards;
      }

      /*  --- ANIMATIONS KEYFRAMES --- */

      @keyframes fall {
        to {
          transform: translate3d(var(--drift), 112vh, 0) rotate(var(--spin));
          opacity: 0.2;
        }
      }
    </style>

    <script src="https://unpkg.com/comfy.js@latest/dist/comfy.min.js"></script>
  </head>
  <body>
    <div id="confetti-container"></div>

    <script>
      // ==========================================
      // 1. CONFIGURATION
      // ==========================================

      const CONFIG = {
        count: 180,
        duration: 8000,
        delay: 15,
        colors: [
          "white",
          "red",
          "pink",
          "purple",
          "blueDark",
          "blueLight",
          "green",
          "yellow",
          "orange",
        ],
      };

      const COLOR_OPTIONS = {
        white: "#ffffff",
        red: "#ff3b30",
        pink: "#ff4081",
        purple: "#a855f7",
        blueDark: "#1d4ed8",
        blueLight: "#00d4ff",
        green: "#44e09c",
        yellow: "#ffeb3b",
        orange: "#ff9800",
      };

      const LOCAL_CONFIG = {};

      const TWITCH = {
        enabled: false,
        channel: "your_twitch_channel",
        command: "!confetti-rain",
        globalCooldown: 500,
        userCooldown: 5000,
      };

      // ==========================================
      // 2. CONSTANTS
      // ==========================================

      const container = document.querySelector("#confetti-container");

      // ==========================================
      // 3. ANIMATION
      // ==========================================

      function randomNumber(minimum, maximum) {
        return Math.random() * (maximum - minimum) + minimum;
      }

      function createConfettiPiece(index) {
        const piece = document.createElement("i");

        piece.className = "piece";
        piece.style.left = `${randomNumber(0, 100)}vw`;
        piece.style.setProperty("--width", `${randomNumber(6, 13)}px`);
        piece.style.setProperty("--height", `${randomNumber(8, 21)}px`);
        piece.style.setProperty(
          "--color",
          COLOR_OPTIONS[CONFIG.colors[index % CONFIG.colors.length]] ??
            CONFIG.colors[index % CONFIG.colors.length],
        );
        piece.style.setProperty(
          "--duration",
          `${CONFIG.duration + randomNumber(-850, 950)}ms`,
        );
        piece.style.setProperty("--drift", `${randomNumber(-18, 18)}vw`);
        piece.style.setProperty("--spin", `${randomNumber(360, 1260)}deg`);

        return piece;
      }

      function triggerConfettiRain() {
        for (let i = 0; i < CONFIG.count; i++)
          setTimeout(() => {
            const piece = createConfettiPiece(i);

            container.append(piece);

            piece.addEventListener("animationend", () => piece.remove());
          }, i * CONFIG.delay);
      }

      // ==========================================
      // 3. CALLBACK (COMFYJS)
      // ==========================================

      if (location.search.includes("preview")) triggerConfettiRain();

      if (TWITCH.enabled) {
        ComfyJS.onCommand = (_, command, _message, _flags, extra) => {
          if (`!${command}`.toLowerCase() !== TWITCH.command.toLowerCase())
            return;
          if (
            extra.sinceLastCommand.any > 0 &&
            extra.sinceLastCommand.any < TWITCH.globalCooldown
          )
            return;
          if (
            extra.sinceLastCommand.user > 0 &&
            extra.sinceLastCommand.user < TWITCH.userCooldown
          )
            return;
          triggerConfettiRain();
        };
        ComfyJS.Init(TWITCH.channel);
      }
    </script>
  </body>
</html>
