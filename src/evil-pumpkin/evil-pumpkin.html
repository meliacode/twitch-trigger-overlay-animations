<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evil Pumpkin</title>

    <style>
      /* Transparent background is required for OBS overlays */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: sans-serif;
      }

      /* Canvas styling for OBS overlays */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
  </head>
  <body>
    <canvas id="evil-pumpkin-canvas"></canvas>

    <script>
      // ==========================================
      // 1. CONFIGURATION
      // ==========================================

      const CONFIG = {
        autoCycle: true,
        cuteDelay: 12000,
        duration: 8000,
        pumpkinScale: 1,
        particleCount: 70,
        pumpkinColor: "#ff8c1a",
        stemColor: "#5f7d2a",
        cuteGlowColor: "#ffd46b",
        evilGlowColor: "#ff3d1f",
        cuteParticleColors: ["#ffb347", "#ff9a1f", "#ffc46b", "#ff7f11"],
        evilParticleColors: ["#ff2d2d", "#d4001a", "#ff4d3d", "#b3001b"],
      };

      const LOCAL_CONFIG = {
        morphDuration: 1600,
        fadeInDuration: 900,
        sizeRatio: 0.28,
        floatAmplitude: 0.07,
        floatSpeed: 1.4,
        evilFloatBoost: 0.35,
        tiltAngle: 4,
        morphPulse: 0.06,
        breathing: 0.015,
        flickerStrength: 0.22,
        particleSpread: 2.1,
        particleMinSpeed: 0.08,
        particleMaxSpeed: 0.22,
        particleMinLife: 2.5,
        particleMaxLife: 5.5,
        particleMinSize: 1.8,
        particleMaxSize: 4.2,
        evilParticleBoost: 0.8,
        eyeSamples: 96,
        mouthSamples: 81,
      };

      const TWITCH = {
        enabled: false,
        channel: "your_twitch_channel",
        command: "!evil",
        globalCooldown: 500,
        userCooldown: 5000,
      };

      // ==========================================
      // 2. CONSTANTS
      // ==========================================

      const canvas = document.querySelector("#evil-pumpkin-canvas");
      const context = canvas.getContext("2d");

      const colorProbe = document
        .createElement("canvas")
        .getContext("2d", { willReadFrequently: true });

      // Face geometry in pumpkin-radius units, for the cute and evil moods.
      const FACE = {
        cuteEye: { x: 0.37, y: -0.12, radiusX: 0.14, radiusY: 0.18 },
        evilEye: {
          x: 0.38,
          y: -0.13,
          vertices: [
            { x: -0.21, y: -0.11 },
            { x: 0.17, y: 0.05 },
            { x: -0.05, y: 0.17 },
          ],
        },
        cutePupil: { x: 0.01, y: 0.03, radiusX: 0.095, radiusY: 0.095 },
        evilPupil: { x: 0.02, y: 0.03, radiusX: 0.022, radiusY: 0.09 },
        cuteMouth: { halfWidth: 0.18, top: 0.25, curve: 0.035, depth: 0.16 },
        evilMouth: { halfWidth: 0.52, top: 0.24, curve: 0.13, depth: 0.2 },
        upperTeeth: { centers: [-0.3, 0.3], halfWidth: 0.14, height: 0.085 },
        lowerTeeth: { centers: [-0.6, 0, 0.6], halfWidth: 0.12, height: 0.07 },
      };

      const BODY_LOBES = [
        { x: -0.6, radiusX: 0.55 },
        { x: 0.6, radiusX: 0.55 },
        { x: -0.3, radiusX: 0.6 },
        { x: 0.3, radiusX: 0.6 },
        { x: 0, radiusX: 0.6 },
      ];

      const WHITE = { r: 255, g: 255, b: 255 };
      const BLACK = { r: 0, g: 0, b: 0 };
      const BLUSH = { r: 255, g: 110, b: 140 };
      const PUPIL = { r: 48, g: 16, b: 0 };

      const particles = [];
      const faceShapes = {};

      let palette = null;
      let width = 0;
      let height = 0;
      let mood = "cute";
      let morphProgress = 0;
      let evilUntil = 0;
      let nextEvilAt = 0;
      let floatPhase = 0;
      let appearedAt = performance.now();
      let lastFrameAt = appearedAt;

      // Resize the canvas backing store for crisp rendering.
      function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;

        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // ==========================================
      // 3. ANIMATION
      // ==========================================

      // Returns a random number within the requested range.
      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      // Blends two numbers by a 0-1 amount.
      function lerp(from, to, amount) {
        return from + (to - from) * amount;
      }

      // Keeps a value inside a range.
      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      // Smooths the start and end of the face transformation.
      function easeInOutCubic(value) {
        return value < 0.5
          ? 4 * value * value * value
          : 1 - Math.pow(-2 * value + 2, 3) / 2;
      }

      // Converts any CSS colour into RGB channels so it can be blended.
      function parseColor(color) {
        colorProbe.clearRect(0, 0, 1, 1);
        colorProbe.fillStyle = "#000000";
        colorProbe.fillStyle = color;
        colorProbe.fillRect(0, 0, 1, 1);

        const [r, g, b] = colorProbe.getImageData(0, 0, 1, 1).data;

        return { r, g, b };
      }

      // Blends two RGB colours by a 0-1 amount.
      function mixColor(from, to, amount) {
        return {
          r: lerp(from.r, to.r, amount),
          g: lerp(from.g, to.g, amount),
          b: lerp(from.b, to.b, amount),
        };
      }

      // Formats an RGB colour as a canvas colour string.
      function toRgba(color, alpha = 1) {
        return `rgba(${Math.round(color.r)}, ${Math.round(color.g)}, ${Math.round(color.b)}, ${alpha})`;
      }

      // Parses the configured colours once.
      function buildPalette() {
        const cuteParticles = CONFIG.cuteParticleColors.map(parseColor);
        const evilParticles = CONFIG.evilParticleColors.map(parseColor);

        return {
          pumpkin: parseColor(CONFIG.pumpkinColor),
          stem: parseColor(CONFIG.stemColor),
          cuteGlow: parseColor(CONFIG.cuteGlowColor),
          evilGlow: parseColor(CONFIG.evilGlowColor),
          cuteParticles: cuteParticles.length ? cuteParticles : [WHITE],
          evilParticles: evilParticles.length ? evilParticles : [WHITE],
        };
      }

      // Finds where a ray from the origin leaves a convex polygon.
      function polygonRadius(vertices, angle) {
        const directionX = Math.cos(angle);
        const directionY = Math.sin(angle);
        let nearest = Infinity;

        for (let index = 0; index < vertices.length; index += 1) {
          const start = vertices[index];
          const end = vertices[(index + 1) % vertices.length];
          const edgeX = end.x - start.x;
          const edgeY = end.y - start.y;
          const denominator = directionX * edgeY - directionY * edgeX;

          if (Math.abs(denominator) < 1e-9) continue;

          const distance = (start.x * edgeY - start.y * edgeX) / denominator;
          const edgeAmount =
            (start.x * directionY - start.y * directionX) / denominator;

          if (distance > 0 && edgeAmount >= 0 && edgeAmount <= 1) {
            nearest = Math.min(nearest, distance);
          }
        }

        return nearest;
      }

      // Samples an eye outline at fixed angles so both moods share topology.
      function sampleEyeOutline(radiusAt) {
        const points = [];

        for (let index = 0; index < LOCAL_CONFIG.eyeSamples; index += 1) {
          const angle = (index / LOCAL_CONFIG.eyeSamples) * Math.PI * 2;
          const radius = radiusAt(angle);

          points.push({
            x: Math.cos(angle) * radius,
            y: Math.sin(angle) * radius,
          });
        }

        return points;
      }

      // Returns the height of the triangular teeth at a mouth position.
      function toothHeight(position, teeth) {
        let amount = 0;

        for (const center of teeth.centers) {
          amount = Math.max(
            amount,
            1 - Math.abs(position - center) / teeth.halfWidth,
          );
        }

        return amount * teeth.height;
      }

      // Samples the upper and lower mouth edges for one mood.
      function sampleMouth(shape, withTeeth) {
        const upper = [];
        const lower = [];

        for (let index = 0; index < LOCAL_CONFIG.mouthSamples; index += 1) {
          const position = -1 + (2 * index) / (LOCAL_CONFIG.mouthSamples - 1);
          const x = position * shape.halfWidth;
          const top = shape.top - shape.curve * position * position;
          const bottom =
            top +
            shape.depth * Math.pow(Math.max(0, 1 - position * position), 0.65);
          const upperTooth = withTeeth
            ? toothHeight(position, FACE.upperTeeth)
            : 0;
          const lowerTooth = withTeeth
            ? toothHeight(position, FACE.lowerTeeth)
            : 0;

          upper.push({ x, y: top + upperTooth });
          lower.push({ x, y: bottom - lowerTooth });
        }

        return { upper, lower };
      }

      // Precomputes matching cute and evil outlines for smooth morphing.
      function buildFaceShapes() {
        const { cuteEye, evilEye } = FACE;
        const centroid = evilEye.vertices.reduce(
          (sum, vertex) => ({
            x: sum.x + vertex.x / evilEye.vertices.length,
            y: sum.y + vertex.y / evilEye.vertices.length,
          }),
          { x: 0, y: 0 },
        );
        const centered = evilEye.vertices.map((vertex) => ({
          x: vertex.x - centroid.x,
          y: vertex.y - centroid.y,
        }));
        const mirrored = centered.map((vertex) => ({
          x: -vertex.x,
          y: vertex.y,
        }));

        faceShapes.cuteEye = sampleEyeOutline(
          (angle) =>
            1 /
            Math.hypot(
              Math.cos(angle) / cuteEye.radiusX,
              Math.sin(angle) / cuteEye.radiusY,
            ),
        );
        faceShapes.evilEyeLeft = sampleEyeOutline((angle) =>
          polygonRadius(centered, angle),
        );
        faceShapes.evilEyeRight = sampleEyeOutline((angle) =>
          polygonRadius(mirrored, angle),
        );
        faceShapes.evilEyeOffset = centroid;
        faceShapes.cuteMouth = sampleMouth(FACE.cuteMouth, false);
        faceShapes.evilMouth = sampleMouth(FACE.evilMouth, true);
      }

      // Places a magic particle somewhere around the pumpkin.
      function resetParticle(particle, randomAge) {
        const angle = Math.random() * Math.PI * 2;
        const distance = randomBetween(0.95, LOCAL_CONFIG.particleSpread);

        particle.baseX = Math.cos(angle) * distance * 1.15;
        particle.y = Math.sin(angle) * distance * 0.85 + 0.35;
        particle.speed = randomBetween(
          LOCAL_CONFIG.particleMinSpeed,
          LOCAL_CONFIG.particleMaxSpeed,
        );
        particle.life = randomBetween(
          LOCAL_CONFIG.particleMinLife,
          LOCAL_CONFIG.particleMaxLife,
        );
        particle.age = randomAge ? Math.random() * particle.life : 0;
        particle.size = randomBetween(
          LOCAL_CONFIG.particleMinSize,
          LOCAL_CONFIG.particleMaxSize,
        );
        particle.sway = randomBetween(0.03, 0.12);
        particle.swaySpeed = randomBetween(0.8, 2);
        particle.phase = Math.random() * Math.PI * 2;
        particle.twinkleSpeed = randomBetween(3, 7);
        particle.rotation = Math.random() * Math.PI;
        particle.isStar = Math.random() < 0.45;
        particle.colorIndex = Math.floor(Math.random() * 1000);
      }

      // Fills the fixed particle pool used for the whole session.
      function createParticles() {
        particles.length = 0;

        for (let index = 0; index < CONFIG.particleCount; index += 1) {
          const particle = {};

          resetParticle(particle, true);
          particles.push(particle);
        }
      }

      // Moves particles upward and recycles the finished ones.
      function updateParticles(delta, morph) {
        const boost = 1 + LOCAL_CONFIG.evilParticleBoost * morph;

        for (const particle of particles) {
          particle.age += delta;
          particle.y -= particle.speed * boost * delta;

          if (particle.age >= particle.life) resetParticle(particle, false);
        }
      }

      // Draws one glowing dot or four-point sparkle.
      function drawSparkle(particle, x, y, color, alpha) {
        const glowRadius = particle.size * 4;
        const gradient = context.createRadialGradient(
          x,
          y,
          0,
          x,
          y,
          glowRadius,
        );

        gradient.addColorStop(0, toRgba(color, 0.55 * alpha));
        gradient.addColorStop(1, toRgba(color, 0));

        context.fillStyle = gradient;
        context.beginPath();
        context.arc(x, y, glowRadius, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = toRgba(mixColor(color, WHITE, 0.6), alpha);
        context.beginPath();

        if (particle.isStar) {
          for (let point = 0; point < 8; point += 1) {
            const radius =
              point % 2 === 0 ? particle.size * 2.4 : particle.size * 0.45;
            const angle = particle.rotation + (point * Math.PI) / 4;

            context.lineTo(
              x + Math.cos(angle) * radius,
              y + Math.sin(angle) * radius,
            );
          }
          context.closePath();
        } else {
          context.arc(x, y, particle.size * 0.7, 0, Math.PI * 2);
        }

        context.fill();
      }

      // Draws the magic particles behind the pumpkin.
      function drawParticles(centerX, centerY, radius, morph, opacity) {
        const { cuteParticles, evilParticles } = palette;

        for (const particle of particles) {
          const lifeAlpha = Math.sin((Math.PI * particle.age) / particle.life);
          const twinkle =
            0.6 +
            0.4 *
              Math.sin(particle.age * particle.twinkleSpeed + particle.phase);
          const x =
            centerX +
            (particle.baseX +
              Math.sin(particle.phase + particle.age * particle.swaySpeed) *
                particle.sway) *
              radius;
          const y = centerY + particle.y * radius;
          const color = mixColor(
            cuteParticles[particle.colorIndex % cuteParticles.length],
            evilParticles[particle.colorIndex % evilParticles.length],
            morph,
          );

          drawSparkle(
            particle,
            x,
            y,
            color,
            Math.max(0, lifeAlpha * twinkle * opacity),
          );
        }
      }

      // Draws the stem behind the top of the pumpkin.
      function drawStem(radius) {
        const gradient = context.createLinearGradient(
          -0.1 * radius,
          0,
          0.1 * radius,
          0,
        );

        gradient.addColorStop(0, toRgba(mixColor(palette.stem, WHITE, 0.15)));
        gradient.addColorStop(1, toRgba(mixColor(palette.stem, BLACK, 0.35)));

        context.fillStyle = gradient;
        context.beginPath();
        context.moveTo(-0.09 * radius, -0.74 * radius);
        context.quadraticCurveTo(
          -0.11 * radius,
          -0.95 * radius,
          -0.03 * radius,
          -1.08 * radius,
        );
        context.lineTo(0.08 * radius, -1.03 * radius);
        context.quadraticCurveTo(
          0.03 * radius,
          -0.92 * radius,
          0.09 * radius,
          -0.74 * radius,
        );
        context.closePath();
        context.fill();
      }

      // Draws the ribbed pumpkin body.
      function drawBody(radius, skin) {
        const light = mixColor(skin, WHITE, 0.28);
        const dark = mixColor(skin, BLACK, 0.42);

        for (const lobe of BODY_LOBES) {
          const x = lobe.x * radius;
          const radiusX = lobe.radiusX * radius;
          const radiusY = 0.86 * radius;
          const gradient = context.createRadialGradient(
            x - radiusX * 0.2,
            -radiusY * 0.35,
            radiusX * 0.1,
            x,
            0,
            radiusY * 1.05,
          );

          gradient.addColorStop(0, toRgba(light));
          gradient.addColorStop(0.55, toRgba(skin));
          gradient.addColorStop(1, toRgba(dark));

          context.fillStyle = gradient;
          context.strokeStyle = toRgba(dark, 0.45);
          context.lineWidth = radius * 0.02;
          context.beginPath();
          context.ellipse(x, 0, radiusX, radiusY, 0, 0, Math.PI * 2);
          context.fill();
          context.stroke();
        }
      }

      // Draws the leaf and curly vine over the stem base.
      function drawLeaf(radius) {
        const leafColor = mixColor(palette.stem, WHITE, 0.12);

        context.save();
        context.translate(0.22 * radius, -0.86 * radius);
        context.rotate(-0.35);
        context.fillStyle = toRgba(leafColor);
        context.beginPath();
        context.ellipse(0, 0, 0.17 * radius, 0.07 * radius, 0, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = toRgba(mixColor(leafColor, BLACK, 0.3), 0.7);
        context.lineWidth = radius * 0.012;
        context.beginPath();
        context.moveTo(-0.15 * radius, 0);
        context.lineTo(0.14 * radius, 0);
        context.stroke();
        context.restore();

        context.strokeStyle = toRgba(palette.stem);
        context.lineWidth = radius * 0.018;
        context.lineCap = "round";
        context.beginPath();
        context.moveTo(-0.04 * radius, -0.8 * radius);
        context.bezierCurveTo(
          -0.25 * radius,
          -0.78 * radius,
          -0.32 * radius,
          -0.98 * radius,
          -0.22 * radius,
          -1.02 * radius,
        );
        context.bezierCurveTo(
          -0.14 * radius,
          -1.05 * radius,
          -0.12 * radius,
          -0.94 * radius,
          -0.19 * radius,
          -0.93 * radius,
        );
        context.stroke();
      }

      // Returns the morphed centre of one eye in pumpkin-radius units.
      function eyeCenter(side, morph) {
        const { cuteEye, evilEye } = FACE;

        return {
          x:
            side *
            lerp(
              cuteEye.x,
              evilEye.x + side * faceShapes.evilEyeOffset.x,
              morph,
            ),
          y: lerp(cuteEye.y, evilEye.y + faceShapes.evilEyeOffset.y, morph),
        };
      }

      // Adds one morphed eye outline to the current path.
      function traceEye(side, morph, radius) {
        const center = eyeCenter(side, morph);
        const evilOutline =
          side < 0 ? faceShapes.evilEyeLeft : faceShapes.evilEyeRight;

        faceShapes.cuteEye.forEach((cutePoint, index) => {
          const evilPoint = evilOutline[index];
          const x = (center.x + lerp(cutePoint.x, evilPoint.x, morph)) * radius;
          const y = (center.y + lerp(cutePoint.y, evilPoint.y, morph)) * radius;

          if (index === 0) context.moveTo(x, y);
          else context.lineTo(x, y);
        });
        context.closePath();
      }

      // Adds the morphed mouth outline to the current path.
      function traceMouth(morph, radius) {
        const { cuteMouth, evilMouth } = faceShapes;
        const count = cuteMouth.upper.length;

        for (let index = 0; index < count; index += 1) {
          const x = lerp(
            cuteMouth.upper[index].x,
            evilMouth.upper[index].x,
            morph,
          );
          const y = lerp(
            cuteMouth.upper[index].y,
            evilMouth.upper[index].y,
            morph,
          );

          if (index === 0) context.moveTo(x * radius, y * radius);
          else context.lineTo(x * radius, y * radius);
        }

        for (let index = count - 1; index >= 0; index -= 1) {
          const x = lerp(
            cuteMouth.lower[index].x,
            evilMouth.lower[index].x,
            morph,
          );
          const y = lerp(
            cuteMouth.lower[index].y,
            evilMouth.lower[index].y,
            morph,
          );

          context.lineTo(x * radius, y * radius);
        }
        context.closePath();
      }

      // Draws the pupil inside one eye.
      function drawEyeDetails(side, morph, radius) {
        const center = eyeCenter(side, morph);
        const { cutePupil, evilPupil } = FACE;
        const pupilX =
          (center.x + side * lerp(cutePupil.x, evilPupil.x, morph)) * radius;
        const pupilY =
          (center.y + lerp(cutePupil.y, evilPupil.y, morph)) * radius;

        context.save();
        context.beginPath();
        traceEye(side, morph, radius);
        context.clip();

        context.fillStyle = toRgba(PUPIL, 0.92);
        context.beginPath();
        context.ellipse(
          pupilX,
          pupilY,
          lerp(cutePupil.radiusX, evilPupil.radiusX, morph) * radius,
          lerp(cutePupil.radiusY, evilPupil.radiusY, morph) * radius,
          0,
          0,
          Math.PI * 2,
        );
        context.fill();

        context.restore();
      }

      // Draws the carved face, blending from cute to evil.
      function drawFace(radius, skin, glow, morph, flicker) {
        const cuteness = 1 - morph;
        const glowGradient = context.createRadialGradient(
          0,
          0.1 * radius,
          0,
          0,
          0.1 * radius,
          0.75 * radius,
        );

        glowGradient.addColorStop(
          0,
          toRgba(
            mixColor(
              glow,
              WHITE,
              clamp((0.5 - 0.32 * morph) * flicker, 0, 0.85),
            ),
          ),
        );
        glowGradient.addColorStop(0.6, toRgba(glow));
        glowGradient.addColorStop(1, toRgba(mixColor(glow, BLACK, 0.3)));

        if (cuteness > 0.01) {
          context.fillStyle = toRgba(BLUSH, 0.42 * cuteness);
          for (const side of [-1, 1]) {
            context.beginPath();
            context.ellipse(
              side * 0.58 * radius,
              0.17 * radius,
              0.12 * radius,
              0.065 * radius,
              0,
              0,
              Math.PI * 2,
            );
            context.fill();
          }
        }

        context.beginPath();
        traceEye(-1, morph, radius);
        traceEye(1, morph, radius);
        traceMouth(morph, radius);

        context.save();
        context.shadowColor = toRgba(glow, 0.9);
        context.shadowBlur = radius * (0.18 + 0.3 * morph) * flicker;
        context.fillStyle = glowGradient;
        context.fill();
        context.restore();

        context.strokeStyle = toRgba(mixColor(skin, BLACK, 0.5), 0.6);
        context.lineWidth = radius * 0.025;
        context.lineJoin = "round";
        context.stroke();

        drawEyeDetails(-1, morph, radius);
        drawEyeDetails(1, morph, radius);
      }

      // Switches between moods when the configured delays have elapsed.
      function updateMood(now) {
        if (mood === "evil" && now >= evilUntil) {
          mood = "cute";
          nextEvilAt = now + LOCAL_CONFIG.morphDuration + CONFIG.cuteDelay;
        } else if (mood === "cute" && CONFIG.autoCycle && now >= nextEvilAt) {
          triggerEvilPumpkin();
        }
      }

      // Turns the pumpkin evil, or extends the evil phase if already evil.
      function triggerEvilPumpkin() {
        mood = "evil";
        evilUntil =
          performance.now() + LOCAL_CONFIG.morphDuration + CONFIG.duration;
      }

      // Updates and draws one frame of the floating pumpkin.
      function renderFrame(now) {
        const delta = Math.min(0.05, (now - lastFrameAt) / 1000);
        const direction = mood === "evil" ? 1 : -1;

        lastFrameAt = now;
        updateMood(now);

        morphProgress = clamp(
          morphProgress +
            (direction * delta * 1000) / LOCAL_CONFIG.morphDuration,
          0,
          1,
        );

        const morph = easeInOutCubic(morphProgress);
        const time = now / 1000;
        const opacity = clamp(
          (now - appearedAt) / LOCAL_CONFIG.fadeInDuration,
          0,
          1,
        );
        const radius =
          Math.min(width, height) *
          LOCAL_CONFIG.sizeRatio *
          CONFIG.pumpkinScale;
        const centerX = width / 2;
        const centerY = height / 2 + radius * 0.08;
        const glow = mixColor(palette.cuteGlow, palette.evilGlow, morph);
        const skin = mixColor(palette.pumpkin, BLACK, 0.22 * morph);
        const noise =
          (Math.sin(time * 13) +
            Math.sin(time * 7.3 + 1) +
            Math.sin(time * 23.1 + 2)) /
          3;
        const flicker =
          1 + noise * LOCAL_CONFIG.flickerStrength * (0.35 + 0.65 * morph);

        floatPhase +=
          delta *
          LOCAL_CONFIG.floatSpeed *
          (1 + LOCAL_CONFIG.evilFloatBoost * morph);
        updateParticles(delta, morph);

        const bob = Math.sin(floatPhase) * LOCAL_CONFIG.floatAmplitude * radius;
        const tilt =
          (Math.sin(floatPhase * 0.7) * LOCAL_CONFIG.tiltAngle * Math.PI) / 180;
        const pulse =
          1 + Math.sin(Math.PI * morphProgress) * LOCAL_CONFIG.morphPulse;
        const breath = Math.sin(floatPhase * 2) * LOCAL_CONFIG.breathing;

        context.clearRect(0, 0, width, height);

        drawParticles(centerX, centerY, radius, morph, opacity);

        context.save();
        context.globalAlpha = opacity;
        context.translate(centerX, centerY + bob);
        context.rotate(tilt);
        context.scale(pulse * (1 + breath), pulse * (1 - breath));
        drawStem(radius);
        drawBody(radius, skin);
        drawLeaf(radius);
        drawFace(radius, skin, glow, morph, flicker);
        context.restore();

        requestAnimationFrame(renderFrame);
      }

      palette = buildPalette();
      buildFaceShapes();
      createParticles();
      nextEvilAt = appearedAt + CONFIG.cuteDelay;
      requestAnimationFrame(renderFrame);

      // ==========================================
      // 3. CALLBACK (COMFYJS)
      // ==========================================

      if (location.search.includes("preview")) triggerEvilPumpkin();

      if (TWITCH.enabled) {
        ComfyJS.onCommand = (_user, command, _message, _flags, extra) => {
          if (`!${command}`.toLowerCase() !== TWITCH.command.toLowerCase())
            return;
          if (
            (extra.sinceLastCommand.any > 0 &&
              extra.sinceLastCommand.any < TWITCH.globalCooldown) ||
            (extra.sinceLastCommand.user > 0 &&
              extra.sinceLastCommand.user < TWITCH.userCooldown)
          )
            return;
          triggerEvilPumpkin();
        };
        ComfyJS.Init(TWITCH.channel);
      }
    </script>
  </body>
</html>
